openapi: 3.1.0
info:
  title: Bulbe Energia - API da Jornada do Cliente
  description: "\n    Backend RESTful para gestão da retenção de clientes, simulação\
    \ de economia \n    e acompanhamento da jornada de homologação CEMIG (90 a 120\
    \ dias).\n    "
  version: 1.0.0
paths:
  /api/v1/pedidos:
    get:
      tags:
      - Jornada do Cliente
      summary: Listar pedidos do cliente
      operationId: listar_pedidos_api_v1_pedidos_get
      security:
      - HTTPBearer: []
      parameters:
      - name: situacao
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtra por situação do pedido.
          enum:
          - em_andamento
          - aprovado
          - reprovado
          title: Situacao
        description: Filtra por situação do pedido.
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Pagina
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginacao_PedidoResumo_'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/pedidos/{id}/status:
    get:
      tags:
      - Jornada do Cliente
      summary: Acompanhar status da homologação
      operationId: obter_status_pedido_api_v1_pedidos__id__status_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPedido'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          description: Dependência externa indisponível sem dado em cache.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/simulacoes:
    post:
      tags:
      - Simulações
      summary: Calcular economia estimada
      description: Público. Com token válido, a simulação é vinculada ao cliente e
        aparece no histórico.
      operationId: criar_simulacao_api_v1_simulacoes_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulacaoRequisicao'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulacaoResposta'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de requisições excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    get:
      tags:
      - Simulações
      summary: Listar histórico de simulações do cliente
      operationId: listar_simulacoes_api_v1_simulacoes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Pagina
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginacao_SimulacaoResumo_'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/simulacoes/{id}:
    get:
      tags:
      - Simulações
      summary: Obter simulação com memória de cálculo
      operationId: obter_simulacao_api_v1_simulacoes__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulacaoResposta'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/beneficios:
    get:
      tags:
      - Clube de Benefícios
      summary: Listar benefícios ativos
      operationId: listar_beneficios_api_v1_beneficios_get
      security:
      - HTTPBearer: []
      parameters:
      - name: trilha
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtra por trilha do clube.
          enum:
          - connect
          - movement
          - experience
          title: Trilha
        description: Filtra por trilha do clube.
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Pagina
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaBeneficios'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/beneficios/{id}:
    get:
      tags:
      - Clube de Benefícios
      summary: Obter um benefício
      operationId: obter_beneficio_api_v1_beneficios__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficio'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/trilhas:
    get:
      tags:
      - Clube de Benefícios
      summary: Listar trilhas do clube
      operationId: listar_trilhas_api_v1_trilhas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaTrilhas'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
      security:
      - HTTPBearer: []
  /api/v1/beneficios/{id}/resgates:
    post:
      tags:
      - Clube de Benefícios
      summary: Resgatar um benefício
      operationId: resgatar_beneficio_api_v1_beneficios__id__resgates_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Obrigatório. UUID gerado pelo cliente a cada tentativa de resgate.
          title: Idempotency-Key
        description: Obrigatório. UUID gerado pelo cliente a cada tentativa de resgate.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ResgateRequisicao'
              - type: 'null'
              title: Corpo
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResgateCriado'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Conflito com o estado atual do recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '410':
          description: Recurso que deixou de estar disponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/resgates:
    get:
      tags:
      - Clube de Benefícios
      summary: Listar resgates do cliente
      operationId: listar_resgates_api_v1_resgates_get
      security:
      - HTTPBearer: []
      parameters:
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Pagina
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginacao_ResgateResumo_'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/ajuda/dicas:
    get:
      tags:
      - Ajuda
      summary: Obter dicas de ajuda de uma tela
      description: Público. Lista vazia significa que a tela não tem ajuda e o botão
        deve ficar escondido.
      operationId: listar_dicas_api_v1_ajuda_dicas_get
      parameters:
      - name: tela
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Obrigatório. Chave da tela.
          enum:
          - simular-desconto
          - status-pedido
          - beneficios
          - impulsione-fatura
          - faturas
          - adesao
          - indique-ganhe
          title: Tela
        description: Obrigatório. Chave da tela.
      - name: elemento
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtra pelo campo ou componente da tela.
          title: Elemento
        description: Filtra pelo campo ou componente da tela.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaDicas'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /:
    get:
      tags:
      - Healthcheck
      summary: Inicio
      operationId: inicio__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AcaoBeneficio:
      properties:
        rotulo:
          type: string
          title: Rotulo
          examples:
          - Acessar
        exige_resgate:
          type: boolean
          title: Exige Resgate
      type: object
      required:
      - rotulo
      - exige_resgate
      title: AcaoBeneficio
    Beneficio:
      properties:
        id:
          type: string
          title: Id
          examples:
          - ben_inter_cashback
        trilha:
          type: string
          title: Trilha
          description: connect, movement ou experience
          examples:
          - connect
        parceiro:
          $ref: '#/components/schemas/ParceiroBeneficio'
        titulo:
          type: string
          title: Titulo
          examples:
          - Até 77% de cashback!
        descricao:
          type: string
          title: Descricao
        regras_de_uso:
          type: string
          title: Regras De Uso
        condicoes_resgate:
          $ref: '#/components/schemas/CondicoesResgate'
        validade:
          $ref: '#/components/schemas/ValidadeBeneficio'
        acao:
          $ref: '#/components/schemas/AcaoBeneficio'
      type: object
      required:
      - id
      - trilha
      - parceiro
      - titulo
      - descricao
      - regras_de_uso
      - condicoes_resgate
      - validade
      - acao
      title: Beneficio
    BlocoLista:
      properties:
        tipo:
          type: string
          const: lista
          title: Tipo
          default: lista
        ordenada:
          type: boolean
          title: Ordenada
        itens:
          items:
            $ref: '#/components/schemas/ItemLista'
          type: array
          title: Itens
      type: object
      required:
      - ordenada
      - itens
      title: BlocoLista
    BlocoParagrafo:
      properties:
        tipo:
          type: string
          const: paragrafo
          title: Tipo
          default: paragrafo
        titulo:
          anyOf:
          - type: string
          - type: 'null'
          title: Titulo
        texto:
          type: string
          title: Texto
      type: object
      required:
      - texto
      title: BlocoParagrafo
    CondicoesResgate:
      properties:
        tipo:
          type: string
          title: Tipo
          description: uso_unico ou recorrente
          examples:
          - uso_unico
        exige_pedido_aprovado:
          type: boolean
          title: Exige Pedido Aprovado
        elegivel:
          type: boolean
          title: Elegivel
        motivo_inelegibilidade:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivo Inelegibilidade
          examples:
          - Disponível após a aprovação do seu pedido pela Cemig.
      type: object
      required:
      - tipo
      - exige_pedido_aprovado
      - elegivel
      - motivo_inelegibilidade
      title: CondicoesResgate
    CorpoErro:
      properties:
        codigo:
          type: string
          title: Codigo
          examples:
          - CONSUMO_FORA_DA_FAIXA
        mensagem:
          type: string
          title: Mensagem
          examples:
          - O valor da fatura deve estar entre R$ 50,00 e R$ 5.000,00.
        detalhes:
          anyOf:
          - items:
              $ref: '#/components/schemas/DetalheErro'
            type: array
          - type: 'null'
          title: Detalhes
          description: Só vem preenchido em erro de validação.
      type: object
      required:
      - codigo
      - mensagem
      title: CorpoErro
    DetalheErro:
      properties:
        campo:
          type: string
          title: Campo
          examples:
          - valor_fatura_centavos
        problema:
          type: string
          title: Problema
          examples:
          - abaixo do mínimo aceito
      type: object
      required:
      - campo
      - problema
      title: DetalheErro
    Dica:
      properties:
        elemento:
          type: string
          title: Elemento
          examples:
          - titulo-status
        titulo:
          type: string
          title: Titulo
          examples:
          - Como funciona o acompanhamento
        rotulo_acessivel:
          type: string
          title: Rotulo Acessivel
          examples:
          - Entender as etapas do pedido
        blocos:
          items:
            oneOf:
            - $ref: '#/components/schemas/BlocoParagrafo'
            - $ref: '#/components/schemas/BlocoLista'
            discriminator:
              propertyName: tipo
              mapping:
                lista: '#/components/schemas/BlocoLista'
                paragrafo: '#/components/schemas/BlocoParagrafo'
          type: array
          title: Blocos
      type: object
      required:
      - elemento
      - titulo
      - rotulo_acessivel
      - blocos
      title: Dica
    Erro:
      properties:
        erro:
          $ref: '#/components/schemas/CorpoErro'
      type: object
      required:
      - erro
      title: Erro
    EstadoVazio:
      properties:
        titulo:
          type: string
          title: Titulo
          examples:
          - Nenhum benefício disponível agora
        mensagem:
          type: string
          title: Mensagem
          examples:
          - Novos benefícios dos parceiros Bulbe aparecem aqui assim que forem liberados.
      type: object
      required:
      - titulo
      - mensagem
      title: EstadoVazio
    EtapaAtualPedido:
      properties:
        ordem:
          type: integer
          title: Ordem
          examples:
          - 1
        chave:
          type: string
          title: Chave
          examples:
          - analise_bulbe
        nome:
          type: string
          title: Nome
          examples:
          - Em análise pela Bulbe
        descricao:
          type: string
          title: Descricao
          examples:
          - Sua solicitação está sendo analisada pela equipe Bulbe.
        situacao:
          type: string
          title: Situacao
          description: pendente, em_andamento ou concluida
          examples:
          - em_andamento
        iniciada_em:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Iniciada Em
          examples:
          - '2026-06-02T09:14:00-03:00'
      type: object
      required:
      - ordem
      - chave
      - nome
      - descricao
      - situacao
      title: EtapaAtualPedido
    EtapaPedido:
      properties:
        ordem:
          type: integer
          title: Ordem
          examples:
          - 1
        chave:
          type: string
          title: Chave
          examples:
          - analise_bulbe
        nome:
          type: string
          title: Nome
          examples:
          - Em análise pela Bulbe
        descricao:
          type: string
          title: Descricao
          examples:
          - Sua solicitação está sendo analisada pela equipe Bulbe.
        situacao:
          type: string
          title: Situacao
          description: pendente, em_andamento ou concluida
          examples:
          - em_andamento
        concluida_em:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Concluida Em
      type: object
      required:
      - ordem
      - chave
      - nome
      - descricao
      - situacao
      title: EtapaPedido
    ItemLista:
      properties:
        titulo:
          anyOf:
          - type: string
          - type: 'null'
          title: Titulo
        texto:
          type: string
          title: Texto
      type: object
      required:
      - texto
      title: ItemLista
    LinhaMemoriaCalculo:
      properties:
        fonte:
          type: string
          title: Fonte
          examples:
          - Bulbe Energia
        consumo_kwh:
          anyOf:
          - type: integer
          - type: 'null'
          title: Consumo Kwh
        valor_centavos:
          type: integer
          title: Valor Centavos
        valor_com_desconto_centavos:
          anyOf:
          - type: integer
          - type: 'null'
          title: Valor Com Desconto Centavos
        possui_desconto:
          type: boolean
          title: Possui Desconto
      type: object
      required:
      - fonte
      - consumo_kwh
      - valor_centavos
      - valor_com_desconto_centavos
      - possui_desconto
      title: LinhaMemoriaCalculo
    ListaTrilhas:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/Trilha'
          type: array
          title: Dados
      type: object
      required:
      - dados
      title: ListaTrilhas
    MemoriaCalculo:
      properties:
        consumo_total_kwh:
          anyOf:
          - type: integer
          - type: 'null'
          title: Consumo Total Kwh
        linhas:
          items:
            $ref: '#/components/schemas/LinhaMemoriaCalculo'
          type: array
          title: Linhas
        subtotal:
          $ref: '#/components/schemas/SubtotalMemoriaCalculo'
        observacao:
          type: string
          title: Observacao
      type: object
      required:
      - consumo_total_kwh
      - linhas
      - subtotal
      - observacao
      title: MemoriaCalculo
    PaginaBeneficios:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/Beneficio'
          type: array
          title: Dados
        pagina:
          type: integer
          title: Pagina
          examples:
          - 1
        limite:
          type: integer
          title: Limite
          examples:
          - 20
        total:
          type: integer
          title: Total
          examples:
          - 1
        estado_vazio:
          anyOf:
          - $ref: '#/components/schemas/EstadoVazio'
          - type: 'null'
          description: Só vem preenchido quando dados está vazio.
      type: object
      required:
      - dados
      - pagina
      - limite
      - total
      title: PaginaBeneficios
    Paginacao_PedidoResumo_:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/PedidoResumo'
          type: array
          title: Dados
        pagina:
          type: integer
          title: Pagina
          examples:
          - 1
        limite:
          type: integer
          title: Limite
          examples:
          - 20
        total:
          type: integer
          title: Total
          examples:
          - 1
      type: object
      required:
      - dados
      - pagina
      - limite
      - total
      title: Paginacao[PedidoResumo]
    Paginacao_ResgateResumo_:
      properties:
        dados:
          items:
            $ref: '#/components/schemas/ResgateResumo'
          type: array
          title: Dados
        pagina:
          type: integer
          title: Pagina
