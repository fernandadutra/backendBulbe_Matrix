openapi: 3.1.0
info:
  title: Bulbe Energia - API da Jornada do Cliente
  description: "\n    Backend RESTful para gestão da retenção de clientes, simulação\
    \ de economia \n    e acompanhamento da jornada de homologação CEMIG (90 a 120\
    \ dias).\n    "
  version: 1.0.0
paths:
  /api/v1/interessados:
    post:
      tags:
      - Adesão
      summary: Registrar o interessado
      description: Público. Devolve o `token_fluxo` que autoriza as rotas de adesão.
      operationId: registrar_interessado_api_v1_interessados_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteressadoRequisicao'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteressadoResposta'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Conflito com o estado atual do recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/adesoes:
    post:
      tags:
      - Adesão
      summary: Abrir a adesão
      description: Autorizado pelo token de fluxo. Se o interessado já tem adesão,
        devolve a existente.
      operationId: abrir_adesao_api_v1_adesoes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdesaoRequisicao'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdesaoResposta'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
      security:
      - HTTPBearer: []
  /api/v1/adesoes/{id}:
    patch:
      tags:
      - Adesão
      summary: Salvar o progresso de uma etapa
      description: Aceita as etapas `contato` e `negocio`. Termos e confirmação têm
        rotas próprias.
      operationId: salvar_etapa_api_v1_adesoes__id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtapaRequisicao'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdesaoResposta'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Conflito com o estado atual do recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/adesoes/{id}/anexos:
    post:
      tags:
      - Adesão
      summary: Enviar a fatura de energia
      description: '`multipart/form-data`. Aceita PDF, JPG e PNG de até 10 MB, conferidos
        pelo conteúdo.'
      operationId: enviar_anexo_api_v1_adesoes__id__anexos_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_enviar_anexo_api_v1_adesoes__id__anexos_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnexoResposta'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Conflito com o estado atual do recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '413':
          description: Arquivo acima do tamanho máximo permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '415':
          description: Formato de arquivo não suportado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/adesoes/{id}/aceites:
    post:
      tags:
      - Adesão
      summary: Registrar o aceite dos termos
      description: Guarda também o IP e o user agent da requisição, para auditoria
        do consentimento.
      operationId: registrar_aceite_api_v1_adesoes__id__aceites_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AceiteRequisicao'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdesaoResposta'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Conflito com o estado atual do recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/adesoes/{id}/submissao:
    post:
      tags:
      - Adesão
      summary: Submeter a adesão
      description: Cria o cliente com a senha informada e o pedido de homologação.
      operationId: submeter_adesao_api_v1_adesoes__id__submissao_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissaoRequisicao'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissaoResposta'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Conflito com o estado atual do recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/sessoes:
    post:
      tags:
      - Autenticação
      summary: Autenticar o cliente
      description: Público. Aceita e-mail ou CPF como identificador.
      operationId: criar_sessao_api_v1_sessoes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessaoRequisicao'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoResposta'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de requisições excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags:
      - Autenticação
      summary: Encerrar a sessão
      description: Invalida o token de renovação. O token de acesso segue válido até
        expirar.
      operationId: encerrar_sessao_api_v1_sessoes_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRenovacaoRequisicao'
        required: true
      responses:
        '204':
          description: Successful Response
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
      security:
      - HTTPBearer: []
  /api/v1/sessoes/renovacao:
    post:
      tags:
      - Autenticação
      summary: Renovar o token de acesso
      description: Público, autorizado pelo token de renovação. O token de renovação
        devolvido substitui o enviado.
      operationId: renovar_sessao_api_v1_sessoes_renovacao_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRenovacaoRequisicao'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoResposta'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/perfil:
    get:
      tags:
      - Autenticação
      summary: Obter perfil e instalações do cliente
      operationId: obter_perfil_api_v1_perfil_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
      security:
      - HTTPBearer: []
  /api/v1/pedidos:
    get:
      tags:
      - Jornada do Cliente
      summary: Listar pedidos do cliente
      operationId: listar_pedidos_api_v1_pedidos_get
      security:
      - HTTPBearer: []
      parameters:
      - name: situacao
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtra por situação do pedido.
          enum:
          - em_andamento
          - aprovado
          - reprovado
          title: Situacao
        description: Filtra por situação do pedido.
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Pagina
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginacao_PedidoResumo_'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/pedidos/{id}/status:
    get:
      tags:
      - Jornada do Cliente
      summary: Acompanhar status da homologação
      operationId: obter_status_pedido_api_v1_pedidos__id__status_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPedido'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          description: Dependência externa indisponível sem dado em cache.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/simulacoes:
    post:
      tags:
      - Simulações
      summary: Calcular economia estimada
      description: Público. Com token válido, a simulação é vinculada ao cliente e
        aparece no histórico.
      operationId: criar_simulacao_api_v1_simulacoes_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulacaoRequisicao'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulacaoResposta'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de requisições excedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    get:
      tags:
      - Simulações
      summary: Listar histórico de simulações do cliente
      operationId: listar_simulacoes_api_v1_simulacoes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Pagina
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginacao_SimulacaoResumo_'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/simulacoes/{id}:
    get:
      tags:
      - Simulações
      summary: Obter simulação com memória de cálculo
      operationId: obter_simulacao_api_v1_simulacoes__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulacaoResposta'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/beneficios:
    get:
      tags:
      - Clube de Benefícios
      summary: Listar benefícios ativos
      operationId: listar_beneficios_api_v1_beneficios_get
      security:
      - HTTPBearer: []
      parameters:
      - name: trilha
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtra por trilha do clube.
          enum:
          - connect
          - movement
          - experience
          title: Trilha
        description: Filtra por trilha do clube.
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Pagina
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaBeneficios'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/beneficios/{id}:
    get:
      tags:
      - Clube de Benefícios
      summary: Obter um benefício
      operationId: obter_beneficio_api_v1_beneficios__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficio'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/trilhas:
    get:
      tags:
      - Clube de Benefícios
      summary: Listar trilhas do clube
      operationId: listar_trilhas_api_v1_trilhas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaTrilhas'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
      security:
      - HTTPBearer: []
  /api/v1/beneficios/{id}/resgates:
    post:
      tags:
      - Clube de Benefícios
      summary: Resgatar um benefício
      operationId: resgatar_beneficio_api_v1_beneficios__id__resgates_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Obrigatório. UUID gerado pelo cliente a cada tentativa de resgate.
          title: Idempotency-Key
        description: Obrigatório. UUID gerado pelo cliente a cada tentativa de resgate.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ResgateRequisicao'
              - type: 'null'
              title: Corpo
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResgateCriado'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Recurso inexistente ou não pertencente ao cliente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Conflito com o estado atual do recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '410':
          description: Recurso que deixou de estar disponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/v1/resgates:
    get:
      tags:
      - Clube de Benefícios
      summary: Listar resgates do cliente
      operationId: listar_resgates_api_v1_resgates_get
      security:
      - HTTPBearer: []
      parameters:
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Pagina
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginacao_ResgateResumo_'
        '400':
          description: Corpo malformado ou parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token ausente, expirado ou inválido.
          content:
